<!doctype html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Gallery - BrandBoost AI</title><link rel='stylesheet' href='styles.css'/></head>
<body>
<div class='loading-overlay' id='loader'><div class='loader-box'><div class='logo'><img src='logo.svg' alt='logo'/></div><h3>Loading Gallery...</h3></div></div>
<div class='app-shell'>
<aside class='sidebar'>
  <div class='nav-title'>Navigation</div>
  <a class='nav-item' href='index.html'><span>💬</span> Chat</a>
  <a class='nav-item' href='media.html'><span>🛠️</span> Photo/Video Maker</a>
  <a class='nav-item' href='analytics.html'><span>📊</span> Business Analytics</a>
</aside>
<main class='main'>
  <div class='topbar'><h2>BrandBoost AI</h2><div class='toolbar'><button class='icon-btn' onclick="location.href='index.html'">🏠</button></div></div>
  <div class='content'>
    <h1 class='welcome-title'>Gallery</h1>
    <div class='small'>View and manage all your generated content</div>
    <div id='gallery' class='panel-grid' style='margin-top:16px'></div>
  </div>
  <div class='footer'>© 2026 Built with ❤️ using Sathish</div>
</main>
</div>
<script src='app-data.js'></script>
<script>
setTimeout(()=>document.getElementById('loader').classList.add('hidden'),700);
(async ()=>{
  const items = getGalleryItems();
  const root = document.getElementById('gallery');
  if (!items.length) root.innerHTML = '<div class="card"><h3>No items yet</h3><p class="small">Create photos/videos and they will appear here.</p></div>';
  items.forEach(item=>{
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`<div class='card-strip'></div><h3>${item.title}</h3><p class='small'>Theme: ${item.theme || '-'}</p>${item.type==='video'?`<video class='media' src='${item.media_url}' controls></video>`:`<img class='media' src='${item.media_url}' alt='generated'/>`}<div class='tool-row' style='margin-top:10px'><button class='icon-btn'>👁️</button><a class='icon-btn' href='${item.media_url}' download target='_blank' style='display:grid;place-items:center;text-decoration:none'>⬇</a><button class='icon-btn' onclick="navigator.share ? navigator.share({title:'BrandBoost Item', url:'${item.media_url}'}) : alert('Share unsupported')">🔗</button></div>`;
    root.appendChild(card);
  });
})();
</script>
</body></html>
