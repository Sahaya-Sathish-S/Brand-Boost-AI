<!doctype html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Photo for Post - BrandBoost AI</title><link rel='stylesheet' href='styles.css'/></head>
<body>
<div class='loading-overlay' id='loader'><div class='loader-box'><div class='logo'><img src='logo.svg' alt='logo'/></div><h3>Loading Photo Maker...</h3></div></div>
<div class='app-shell'>
<aside class='sidebar'>
  <div class='nav-title'>Navigation</div>
  <a class='nav-item' href='index.html'><span>💬</span> Chat</a>
  <a class='nav-item active' href='media.html'><span>🛠️</span> Photo/Video Maker</a>
  <a class='nav-item' href='analytics.html'><span>📊</span> Business Analytics</a>
</aside>
<main class='main'>
  <div class='topbar'><h2>BrandBoost AI</h2><div class='toolbar'><button class='icon-btn' onclick="location.href='media.html'">⬅</button><button class='icon-btn' onclick="location.href='gallery.html'">🖼️</button></div></div>
  <div class='content form-page'>
    <h1 class='welcome-title'>Photo for Post</h1>
    <div class='small'>Create professional posters for your social media</div>

    <div class='card' style='cursor:default;margin-top:14px'>
      <h3>Company Information</h3>
      <div class='panel-grid' style='grid-template-columns:1fr 1fr'>
        <div><label>Company Name *</label><input id='companyName' placeholder='Your company name'/></div>
        <div><label>Category *</label><input id='category' placeholder='Business category'/></div>
        <div><label>Product/Service *</label><input id='product' placeholder='What you sell'/></div>
        <div><label>Special Offer</label><input id='offer' placeholder='Discount/offer'/></div>
        <div><label>Address</label><input id='address' placeholder='Business address'/></div>
        <div><label>Contact</label><input id='contact' placeholder='Phone/email/website'/></div>
      </div>
      <label>Additional Details</label>
      <textarea id='brief' rows='3' placeholder='Extra details for poster style'></textarea>

      <label>Upload Your Image (Optional)</label>
      <input id='sourceImage' type='file' accept='image/*'/>

      <button class='start-btn' id='toThemeBtn'>Continue to Theme Selection</button>
    </div>

    <div id='themeBlock' class='card hidden' style='cursor:default;margin-top:14px'>
      <h3>Select a Theme</h3>
      <div class='theme-selector' id='themeSelector'></div>
      <button class='start-btn' id='generatePosterBtn'>Generate Poster</button>
    </div>

    <div id='posterOutput' class='result-card hidden'></div>
  </div>
  <div class='footer'>© 2026 Built with ❤️ using Sathish</div>
</main>
</div>
<script src='app-data.js'></script>
<script src='photo-maker.js'></script>
</body></html>
