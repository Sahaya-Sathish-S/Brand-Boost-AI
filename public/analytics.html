<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Business Analytics - BrandBoost AI</title><link rel="stylesheet" href="/styles.css"/></head>
<body><main class="main" style="min-height:100vh"><div class="toolbar"><button class="icon-btn" onclick="location.href='/'">🏠</button><button class="icon-btn" onclick="location.href='/gallery.html'">🖼️</button></div>
<div class="brand-name">BrandBoost AI</div><div class="welcome-title">Business Analytics</div>

<div class="card" style="margin-bottom:14px; cursor:default;">
  <h3>Analytics Input</h3>
  <div class="panel-grid" style="grid-template-columns:repeat(4, minmax(160px,1fr)); margin-top:8px;">
    <input id="investment" type="number" placeholder="Investment" value="125000"/>
    <input id="revenue" type="number" placeholder="Revenue" value="198000"/>
    <input id="expenses" type="number" placeholder="Expenses" value="82000"/>
    <input id="growth" type="number" placeholder="Monthly Growth %" value="12"/>
  </div>
  <div class="tool-row" style="margin-top:12px;">
    <button class="glow-btn" id="analyzeBtn" style="max-width:180px; margin:0;">📊 Analyze</button>
    <button class="glow-btn" id="downloadBtn" style="max-width:220px; margin:0;">⬇ Download Report</button>
    <span class="badge">Tool: ROI Predictor</span>
    <span class="badge">Tool: Budget Mix Advisor</span>
    <span class="badge">Tool: Risk Gauge</span>
  </div>
</div>

<div class="kpi-grid" id="kpiGrid"></div>
<div class="chart-grid">
  <div class="card" style="cursor:default;"><h3>Budget Pie Chart</h3><canvas id="pie" width="420" height="300"></canvas></div>
  <div class="card" style="cursor:default;"><h3>Performance Bars</h3><canvas id="bars" width="420" height="300"></canvas></div>
</div>

</main>
<script>
let latest = null;
function drawPie(data){
  const c = document.getElementById('pie'); const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  const colors = ['#ff7a59','#49d7ff','#8f7bff','#ffcd4d'];
  const total = data.pie.reduce((a,b)=>a+b.value,0); let start=0;
  data.pie.forEach((slice,i)=>{
    const ang = (slice.value/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(145,150); ctx.arc(145,150,105,start,start+ang); ctx.closePath();
    ctx.fillStyle = colors[i%colors.length]; ctx.fill(); start += ang;
    ctx.fillStyle='#fff'; ctx.fillRect(280,36+i*30,12,12); ctx.fillText(`${slice.label} (${slice.value}%)`,300,47+i*30);
  });
}
function drawBars(data){
  const c = document.getElementById('bars'); const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  const labels=['Investment','Revenue','Profit','Expenses'];
  const vals=[data.investment,data.revenue,data.profit,data.expenses];
  const max=Math.max(...vals)*1.1;
  labels.forEach((l,i)=>{
    const h=(vals[i]/max)*200; const x=40+i*90; const y=250-h;
    ctx.fillStyle=['#8f7bff','#49d7ff','#62efb4','#ff7a59'][i];
    ctx.fillRect(x,y,50,h);
    ctx.fillStyle='#fff'; ctx.fillText(l,x-4,272); ctx.fillText(`₹${Math.round(vals[i]/1000)}k`,x-2,y-8);
  });
}
function render(data){
  latest=data;
  const roi = (((data.revenue-data.expenses-data.investment)/data.investment)*100).toFixed(1);
  const kpis = [
    ['Investment', `₹${data.investment.toLocaleString()}`],
    ['Revenue', `₹${data.revenue.toLocaleString()}`],
    ['Profit', `₹${data.profit.toLocaleString()}`],
    ['Loss Risk', `${data.lossRisk}%`],
    ['Growth', `${data.growth}%`],
    ['ROI', `${roi}%`]
  ];
  document.getElementById('kpiGrid').innerHTML = kpis.map(k=>`<div class='kpi'><div class='small'>${k[0]}</div><h3 style='margin:6px 0 0'>${k[1]}</h3></div>`).join('');
  drawPie(data); drawBars(data);
}

async function loadDefault(){
  const data = await fetch('/api/analytics').then(r=>r.json());
  render(data);
}

document.getElementById('analyzeBtn').onclick = ()=>{
  const investment = Number(document.getElementById('investment').value || 0);
  const revenue = Number(document.getElementById('revenue').value || 0);
  const expenses = Number(document.getElementById('expenses').value || 0);
  const growth = Number(document.getElementById('growth').value || 0);
  const profit = Math.max(0, revenue - expenses);
  const lossRisk = Math.max(1, Math.min(80, Math.round((expenses / Math.max(revenue,1))*30)));
  const pie = [
    {label:'Ads', value: Math.round((investment*0.35)/Math.max(investment,1)*100)},
    {label:'Operations', value: 25},
    {label:'Product', value: 20},
    {label:'Savings', value: 20}
  ];
  render({investment,revenue,expenses,profit,lossRisk,growth,pie});
};

document.getElementById('downloadBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(latest,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='brandboost-analytics-report.json'; a.click();
};

loadDefault();
</script></body></html>
