<!doctype html>
<html>
<head>
  <meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/>
  <title>BrandBoost AI</title><link rel='stylesheet' href='styles.css'/>
</head>
<body>
<div class='loading-overlay' id='loader'><div class='loader-box'><div class='logo'><img src='logo.svg' alt='logo'/></div><h3>Loading BrandBoost AI...</h3></div></div>
<div class='app-shell'>
  <aside class='sidebar'>
    <div class='nav-title'>Navigation</div>
    <a class='nav-item active' href='index.html'><span>💬</span> Chat</a>
    <a class='nav-item' href='media.html'><span>🛠️</span> Photo/Video Maker</a>
    <a class='nav-item' href='analytics.html'><span>📊</span> Business Analytics</a>
  </aside>

  <main class='main'>
    <div class='topbar'>
      <h2>BrandBoost AI</h2>
      <div class='toolbar'>
        <button class='icon-btn' id='loginBtn' title='Google login'>👤</button>
        <button class='icon-btn' id='menuBtn' title='Menu'>☰</button>
        <button class='icon-btn' onclick="location.href='gallery.html'" title='Gallery'>🖼️</button>
      </div>
    </div>

    <div class='content'>
      <h1 class='welcome-title'>Welcome to Marketing</h1>
      <div class='subtitle'>BrandBoost AI</div>
      <div class='small'>Welcome to Chat</div>

      <div class='action-row'>
        <button class='glow-btn' id='showHistoryBtn'>💬 Show History</button>
        <button class='glow-btn primary' id='newChatBtn'>➕ New Chat</button>
        <button class='glow-btn' id='clearChatBtn'>🗑️ Clear Chat</button>
      </div>

      <div class='chat-layout'>
        <div class='chat-box' id='chatBox'><div class='chat-empty'>No messages yet. Start the conversation!</div></div>
        <div class='chat-input-row'>
          <input id='messageInput' placeholder='Enter message...'/>
          <input id='mediaInput' type='file' accept='image/*,video/*' class='hidden'/>
          <button class='icon-btn' id='uploadBtn' title='Upload media'>📎</button>
          <button class='icon-btn' id='sendBtn' title='Send'>Send</button>
          <button class='icon-btn' id='saveProfileBtn' title='Save profile'>💾</button>
        </div>
      </div>
      <div class='hidden history-list' id='chatHistory'></div>
    </div>

    <div class='footer'>© 2026 Built with ❤️ using Sathish</div>
  </main>
</div>
<script src='app-data.js'></script>
<script src='main.js'></script>
</body></html>
